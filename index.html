utton id="backForm" class="btn btn2">入力に戻る</button></div></div></section><section id="confirm" class="card hide"><h2>この内容で作成します</h2><div id="summary" class="summary"></div><p id="confirmMsg"></p><div class="actions"><button id="make" class="btn">選んだ販促物を作成</button><button id="backPlans" class="btn btn2">企画に戻る</button></div></section><section id="results" class="hide"><h2 id="rtitle">販促セット</h2><div id="tabs" class="tabs"></div><div class="card"><div id="result" class="copy"></div><p id="saveMsg"></p><div class="actions"><button id="done" class="btn btn2">HOME</button></div></div></section></main><script>

let popScaleHold=null;
const popScaleClickBlocks=new WeakSet();
function stopPopScaleHold(cancel=false){

window.startPopScaleHold=(event,key,delta)=>{
 if(!event.isPrimary||event.button!==0)return;
 stopPopScaleHold(true);
 const button=event.currentTarget;
 button.focus({preventScroll:true});
 popScaleClickBlocks.delete(button);
 const hold={button,key,delta,pointerId:event.pointerId,started:performance.now(),repeated:false,timer:null};
 popScaleHold=hold;
 const repeat=()=>{
  if(popScaleHold!==hold)return;
  if(!button.isConnected||tab!=='popdesign'||document.hidden){stopPopScaleHold(true);return;}
  hold.repeated=true;
  const before=popScale(key);
  adjustPopScale(key,delta);
  if(popScale(key)===before||popScale(key)===.5||popScale(key)===1.5){stopPopScaleHold();return;}
  const elapsed=performance.now()-hold.started;
  hold.timer=setTimeout(repeat,elapsed<1200?180:elapsed<2400?100:60);
 };
 hold.timer=setTimeout(repeat,400);
};
window.clickPopScale=(event,key,delta)=>{

 if(event.detail!==0&&popScaleClickBlocks.has(button)){popScaleClickBlocks.delete(button);return;}

};

function fitFourPop(){

 const scales={popTitle:popScale('title'),popSub:popScale('sub'),popGift:popScale('gift'),popFooter:popScale('footer')};
 const blocks=[...frame.querySelectorAll('[data-pop-block]')].filter(el=>el.textContent.trim()).sort((a,b)=>parseFloat(a.style.top)-parseFloat(b.style.top));
 let autoShrunk=false;
 const centers=blocks.map(el=>clamp(parseFloat(el.style.top)/100*h,margin*h,(1-margin)*h));
 blocks.forEach((el,i)=>{
  const top=i?(centers[i-1]+centers[i])/2:margin*h,bottom=i<blocks.length-1?(centers[i]+centers[i+1])/2:(1-margin)*h;
  let size=p.blocks[el.dataset.popBlock].size*scales[el.dataset.popBlock]*w/620;

  while((el.offsetHeight>bottom-top-gap||el.scrollWidth>el.clientWidth+1)&&size>minimum){size=Math.max(minimum,size-0.5);el.style.fontSize=size+'px';}
  autoShrunk ||= size<requestedSize;
  const y=clamp(centers[i],top+gap/2+el.offsetHeight/2,bottom-gap/2-el.offsetHeight/2);
  el.style.top=(y/h*100)+'%';
  const half=el.offsetWidth/2;el.style.left=(clamp(parseFloat(el.style.left)/100*w,half+margin*w,w-half-margin*w)/w*100)+'%';
 });
 const bounds=frame.getBoundingClientRect(),rects=blocks.map(el=>el.getBoundingClientRect());
 const bad=rects.some((r,i)=>r.left<bounds.left+margin*w-1||r.right>bounds.right-margin*w+1||r.top<bounds.top+margin*h-1||r.bottom>bounds.bottom-margin*h+1||(i&&r.top<rects[i-1].bottom+gap-1)||blocks[i].scrollWidth>blocks[i].clientWidth+1);

 return !bad;

function modernPopParts(){
  const p=contents.pop||{}, seen=new Set();
  const unique=value=>{
    const text=String(value??'').replace(/\r\n?/g,'\n');
    if(text.includes('\n')){
      for(const line of text.split('\n')){const key=line.replace(/\s/g,'');if(key)seen.add(key);}
      return text;
    }
    const key=text.replace(/\s/g,'');
    if(!key||seen.has(key))return '';
    seen.add(key);return text;
  };
  // Multiline input is verbatim; retain the existing single-line de-duplication.
  const gift=unique(p.gift_display??selected.gift);
  const headline=unique(p.headline??selected.title),sub=unique(p.subheadline??selected.catch);
  const footer=unique(p.footer_display??p.footer??'');
  return {headline,sub,gift,footer};
}

function fitModernPop(){
  if(isFourPop())return fitFourPop();
  const frame=document.querySelector('.popModern');if(!frame)return;
  const w=frame.clientWidth,h=frame.clientHeight;if(!w||!h)return;
  applyPopBrandGap(frame);
  const scales={popTitle:popScale('title'),popSub:popScale('sub'),popGift:popScale('gift'),popFooter:popScale('footer')};
  const sizes={popTitle:40,popSub:20,popGift:contents.pop.design_variant==='menu'?32:26,popFooter:15};
  const blocks=[...frame.querySelectorAll('[data-pop-block]')].sort((a,b)=>parseFloat(a.style.top)-parseFloat(b.style.top));
  let autoShrunk=false;
  const centers=blocks.map(el=>clamp(parseFloat(el.style.top)/100*h,h*.08,h*.92));
  blocks.forEach((el,i)=>{const top=i?(centers[i-1]+centers[i])/2:h*.06,bottom=i<blocks.length-1?(centers[i]+centers[i+1])/2:h*.94;
    let size=sizes[el.dataset.popBlock]*scales[el.dataset.popBlock]*w/620;
    el.style.fontSize=size+'px';el.querySelectorAll('div').forEach(d=>d.style.fontSize='inherit');
    const requestedSize=size;
    const min=el.dataset.popBlock==='popFooter'?11*w/620:12*w/620;
    while(el.offsetHeight>bottom-top-12*w/620&&size>min){size=Math.max(min,size-1);el.style.fontSize=size+'px';}
    autoShrunk ||= size<requestedSize;
    const y=clamp(centers[i],top+el.offsetHeight/2,bottom-el.offsetHeight/2);
    el.style.top=(y/h*100)+'%';
    const half=el.offsetWidth/2;el.style.left=(clamp(parseFloat(el.style.left)/100*w,half+w*.04,w-half-w*.04)/w*100)+'%';
  });
  const rects=blocks.map(el=>el.getBoundingClientRect()),bounds=frame.getBoundingClientRect();
  const bad=rects.some((r,i)=>r.top<bounds.top+h*.03||r.bottom>bounds.bottom-h*.03||(i>0&&r.top<rects[i-1].bottom+2));
  frame.dataset.overflow=bad?'true':'false';
  const message=document.getElementById('popFitMsg');if(message)message.textContent=bad?'文字が収まりません。文章を短くするか、文字サイズ・位置を調整してください。':autoShrunk?'収まるよう自動調整しています。':'';
  return !bad;
}

async function generateOneImage(revision,variant){const j=await api('/api/image',{prompt:contents.image?.prompt_ja||`${selected.title} ${selected.gift}`,revision,variant});return j.image_base64?`data:image/png;base64,${j.image_base64}`:j.image_url}
window.generateCandidates=async()=>{
  const revision=$('rev')?.value||'';
  const variants=['treatment','interior','concept'];

  imageCandidates=[];
  imageCandidateLabels=[];
  imageStatus='方向性の違うAI画像を生成しています… 0/3';
  render();

  const made=[];

  for(let i=0;i<variants.length;i++){
    imageStatus=`AI画像を生成しています… ${i+1}/3`;
    render();

    try{
      const src=await generateOneImage(revision,variants[i]);
      if(src){
  made.push(src);
  imageCandidateLabels.push(
    variants[i]==='treatment' ? '人物・施術' :
    variants[i]==='interior' ? 'サロン空間' :
    'イメージビジュアル'
  );
}

    }catch(e){
      try{
        const safeRevision=`
人物の身体への施術を直接見せない。
人物を使わず、施術ベッド、タオル、植物、ハーブ、
オイル、美容用品、自然光などを使って、
今回の美容ケアを上品に連想できる広告イメージにする。
性的・官能的な表現は一切含めない。
`;

        const retrySrc=await generateOneImage(
          safeRevision,
          i===1?'interior':'concept'
        );

        if(retrySrc){
  made.push(retrySrc);
  imageCandidateLabels.push(
    i===0 ? '施術イメージ（人物・施術の代替案）' :
i===1 ? 'サロン空間（人物・施術の代替案）' :
'イメージビジュアル（人物・施術の代替案）'
  );
}

      }catch(retryError){
        console.warn(
          `画像候補${i+1}は生成できませんでした`,
          retryError
        );
      }
    }
  }

  imageCandidates=made;

  if(made.length===3){
    imageStatus='方向性の違う3候補から使いたい画像を選んでください。';
  }else if(made.length){
    imageStatus=`${made.length}候補を生成しました。必要に応じてもう一度生成できます。`;
  }else{
    imageStatus='エラー：画像を生成できませんでした。もう一度お試しください。';
  }

  render();
};

window.deletePromo=async id=>{if(!confirm('この販促データを削除しますか？\n文章・保存画像も削除されます。'))return;try{const{data:imgs}=await sb.from('promotion_images').select('storage_path').eq('promotion_id',id),paths=(imgs||[]).map(x=>x.storage_path).filter(Boolean);if(paths.length){const{error:se}=await sb.storage.from('promotion-images').remove(paths);if(se)throw se}let r=await sb.from('promotion_images').delete().eq('promotion_id',id);if(r.error)throw r.error;r=await sb.from('promotion_contents').delete().eq('promotion_id',id);if(r.error)throw r.error;r=await sb.from('promotions').delete().eq('id',id);if(r.error)throw r.error;await hist()}catch(e){alert('削除できませんでした：'+e.message)}};
function drawCover(ctx,im,w,h){const s=Math.max(w/im.width,h/im.height),sw=im.width*s,sh=im.height*s;ctx.drawImage(im,(w-sw)/2,(h-sh)/2,sw,sh)}
function wrapLines(ctx,text,maxWidth){const all=[];for(const para of String(text||'').split('\n')){let line='';for(const ch of[...para]){if(ctx.measureText(line+ch).width>maxWidth&&line){all.push(line);line=ch}else line+=ch}all.push(line)}return all}
function drawTextBlock(ctx,text,x,y,size,maxWidth,lineH,align,font='sans-serif',weight='400'){ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign=align;const lines=wrapLines(ctx,text,maxWidth);lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineH));return y+lines.length*lineH}
async function loadCanvasImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
window.downloadPop=async()=>{
  const el=document.querySelector('.popPreview');

  if(!el){
    return alert('POPプレビューが見つかりません。');
  }

  try{
    if(document.fonts?.ready){
      await document.fonts.ready;
    }

    if(isModernPop()&&fitModernPop()===false)return alert('文字が収まりません。文章・サイズ・位置を調整してから保存してください。');
    const bounds=el.getBoundingClientRect();
    const scale=1240/bounds.width;

    const canvas=await html2canvas(el,{
      width:bounds.width,
      height:bounds.height,
      scale:scale,
      useCORS:true,
      allowTaint:false,
      backgroundColor:null,
      logging:false
    });

    const a=document.createElement('a');
    a.download=`${selected.title||'salon-pop'}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();

  }catch(e){
    console.error(e);
    alert('POP画像を保存できませんでした。');
  }
};
window.downloadInsta=async()=>{
 if(!imageSrc)return alert('先に画像を選んでください。');
 try{
  captureInstaDraft();refreshInstaPreview();
  const frame=document.querySelector('.instaFrame');if(!frame)throw Error('Instagram画像のプレビューがありません。');
  await Promise.all([...frame.querySelectorAll('img')].map(img=>img.decode()));
  if(document.fonts?.ready)await document.fonts.ready;
  await new Promise(resolve=>requestAnimationFrame(resolve));
  if(layoutInstaPreview()===false)throw Error('文字が収まりません。文章やサイズ・位置を調整してください。');
  const bounds=frame.getBoundingClientRect();
  const canvas=await html2canvas(frame,{width:bounds.width,height:bounds.height,scale:1200/bounds.width,useCORS:true,allowTaint:false,backgroundColor:null,logging:false});
  const a=document.createElement('a');a.download=`${selected.title||'instagram'}.png`;a.href=canvas.toDataURL('image/png');a.click();
 }catch(e){alert('Instagram画像を保存できませんでした：'+e.message);}
};
