<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月間サロン販促メーカー</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f3ee;--ink:#3d372f;--muted:#7a7168;--line:#ded6cd;--accent:#7f8f72;--gold:#a88c64;--soft:#eee8e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px 50px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 6px 24px rgba(59,48,39,.04)}.hero{text-align:center;padding:42px}.btn{border:0;border-radius:11px;padding:12px 17px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.btn2{background:#fff;color:var(--ink);border:1px solid var(--line)}.linkbtn{background:none;border:0;color:#5f7256;text-decoration:underline;cursor:pointer;padding:8px 0;font:inherit}label{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}textarea{min-height:92px}.row,.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editGrid .full{grid-column:1/-1}.actions,.checks,.tabs,.seg,.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hide{display:none}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plan{border:1px solid var(--line);border-radius:16px;padding:18px}.plan.reco{outline:2px solid var(--accent)}.tag{display:inline-block;background:var(--gold);color:#fff;border-radius:999px;padding:5px 8px;font-size:11px}.muted{color:var(--muted)}.error{color:#a04444}.ok{color:#58704f}.summary{display:grid;grid-template-columns:160px 1fr;gap:9px 14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.tab.active,.seg button.active{background:var(--accent);color:#fff}.copy{line-height:1.8;background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:16px}.check{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}.check input{width:auto}.item{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:hover{background:#faf8f5}.quick,.seg{justify-content:center}.quick button,.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer}.controlBox{background:var(--soft);border-radius:12px;padding:14px;margin:14px 0}.instaFrame{width:min(100%,620px);aspect-ratio:1/1;margin:auto;position:relative;overflow:hidden;border-radius:14px;background:#eee}.instaFrame img{width:100%;height:100%;object-fit:cover}.instaOverlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8%;background:linear-gradient(to bottom,transparent 42%,rgba(35,31,27,.15) 60%,rgba(35,31,27,.64) 100%);color:#fff;text-shadow:0 1px 8px #0005}.instaTitle{font-family:serif;font-size:clamp(24px,5vw,48px);line-height:1.25;font-weight:600;white-space:pre-line}.instaGift{font-size:clamp(14px,2.4vw,23px);margin-top:10px;white-space:pre-line}.popPreview{width:min(100%,620px);aspect-ratio:210/297;margin:auto;background:#faf7f2;position:relative;overflow:hidden;box-shadow:0 8px 30px #0002}.popPhoto{position:relative;overflow:hidden;background:#eee8e0}.popPhoto img{width:100%;height:100%;object-fit:cover;opacity:.58}.popPhoto:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.10),rgba(255,255,255,.32) 55%,rgba(250,247,242,.80) 100%)}.popOverlayMain{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8%;color:#3d372f}.popK{font-size:clamp(10px,1.7vw,15px);letter-spacing:.14em;color:#766651;margin-bottom:2%}.popH{font-family:serif;font-size:clamp(24px,4.8vw,44px);line-height:1.2;font-weight:600;white-space:pre-line}.popSub{font-size:clamp(12px,2vw,18px);line-height:1.55;margin-top:3%;white-space:pre-line}.popGift{border-top:1px solid #917d64;border-bottom:1px solid #917d64;padding:2.5% 5%;font-family:serif;font-size:clamp(18px,3.2vw,30px);margin-top:4%;white-space:pre-line}.popBottom{padding:5% 9%;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:12px}.popFoot{font-size:clamp(10px,1.7vw,15px);line-height:1.6;white-space:pre-line}.popBrand{font-size:clamp(10px,1.6vw,14px);letter-spacing:.12em;color:#665c52}.ratioBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.ratioBtn.active{background:var(--accent);color:#fff}.generated{width:100%;max-width:620px;border-radius:14px}@media(max-width:760px){.row,.plans,.editGrid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.editGrid .full{grid-column:auto}}</style></head><body><main class="wrap"><div class="head"><div><h2 style="margin:0">月間サロン販促メーカー</h2><div id="salonName" class="muted">テスト版</div></div><button id="logout" class="btn btn2 hide">ログアウト</button></div><section id="login" class="card"><h2>ログイン</h2><label>メールアドレス</label><input id="email" type="email"><label>パスワード</label><input id="password" type="password"><p id="loginMsg"></p><div class="actions"><button id="loginBtn" class="btn">ログイン</button><button id="signupBtn" class="btn btn2">新規登録</button></div><button id="forgotBtn" class="linkbtn">パスワードを忘れた方</button></section><section id="forgot" class="card hide"><h2>パスワード再設定</h2><label>メールアドレス</label><input id="resetEmail" type="email"><p id="forgotMsg"></p><div class="actions"><button id="sendReset" class="btn">再設定メールを送る</button><button id="backLogin" class="btn btn2">ログインへ戻る</button></div></section><section id="newPassword" class="card hide"><h2>新しいパスワードを設定</h2><label>新しいパスワード</label><input id="newPass1" type="password"><label>新しいパスワード（確認）</label><input id="newPass2" type="password"><p id="newPassMsg"></p><button id="saveNewPass" class="btn">パスワードを変更</button></section><section id="setup" class="card hide"><h2>サロン初期設定</h2><label>サロン名</label><input id="sname"><label>コンセプト</label><textarea id="concept"></textarea><label>主なお客様</label><input id="customer" value="30〜50代女性"><p id="setupMsg"></p><button id="setupSave" class="btn">保存</button></section><section id="home" class="hide"><div class="card hero"><h2>今月の販促を、まとめて作成</h2><button id="newBtn" class="btn">＋ 新しい販促をつくる</button></div><div class="card"><h3>最近作った販促</h3><p class="muted">クリックすると画像を含めて再確認・修正できます。</p><div id="history"></div></div></section><section id="form" class="card hide"><h2>今月は、どんな企画にしますか？</h2><div class="row"><div><label>開始日</label><input id="start" type="date" value="2026-09-01"></div><div><label>終了日</label><input id="end" type="date" value="2026-09-30"></div></div><label>希望テーマ</label><input id="theme" value="夏の頭の疲れ"><label>プレゼント内容</label><input id="gift" value="提案希望"><label>対象者</label><input id="target" value="ご来店のお客様全員"><label>販売・利用につなげたいもの</label><input id="sales" value="なし"><label>条件</label><input id="conditions" value="お一人様1回限り"><label>今回作成するもの</label><div class="checks"><label class="check"><input id="outPop" type="checkbox" checked>店内POP</label><label class="check"><input id="outLine" type="checkbox" checked>LINE配信文</label><label class="check"><input id="outInsta" type="checkbox" checked>Instagram投稿文</label><label class="check"><input id="outImage" type="checkbox" checked>Instagram画像</label></div><div class="row"><div><label>LINEの絵文字</label><select id="lineEmoji"><option value="none">なし</option><option value="low" selected>控えめ</option><option value="standard">標準</option></select></div><div><label>Instagramの絵文字</label><select id="instaEmoji"><option value="none">なし</option><option value="low" selected>控えめ</option><option value="standard">標準</option></select></div></div><p id="formMsg"></p><div class="actions"><button id="propose" class="btn">AIに販促プランを提案してもらう</button><button id="homeBtn" class="btn btn2">HOME</button></div></section><section id="plansSec" class="hide"><h2>AIから3つの販促プラン</h2><div id="plans" class="plans"></div><div class="card"><label>こんな感じにしたい</label><textarea id="note"></textarea><div class="actions"><button id="regen" class="btn">希望を反映して再提案</button><button id="backForm" class="btn btn2">入力に戻る</button></div></div></section><section id="confirm" class="card hide"><h2>この内容で作成します</h2><div id="summary" class="summary"></div><p id="confirmMsg"></p><div class="actions"><button id="make" class="btn">選んだ販促物を作成</button><button id="backPlans" class="btn btn2">企画に戻る</button></div></section><section id="results" class="hide"><h2 id="rtitle">販促セット</h2><div id="tabs" class="tabs"></div><div class="card"><div id="result" class="copy"></div><p id="saveMsg"></p><div class="actions"><button id="done" class="btn btn2">HOME</button></div></div></section></main><script>const sb=supabase.createClient('https://ufnpkftqwmbtlracvaaf.supabase.co','sb_publishable_ddDiJawM9TR4Fe_Yuopqqg_ZKaR_KFK');let user,salon,settings,plans=[],selected,contents={},tab='',imageSrc='',instaTextMode='none',overlayTitle='',overlayGift='',overlayFooter='',outputs=[],currentPromoId=null,popRatio=55;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(id){['login','forgot','newPassword','setup','home','form','plansSec','confirm','results'].forEach(x=>$(x).classList.toggle('hide',x!==id));$('logout').classList.toggle('hide',!['setup','home','form','plansSec','confirm','results'].includes(id))}async function boot(){const{data:{user:u}}=await sb.auth.getUser();user=u;if(!u)return show('login');const{data:s}=await sb.from('salons').select('*').limit(1).maybeSingle();salon=s;if(!s)return show('setup');const{data:st}=await sb.from('salon_settings').select('*').eq('salon_id',s.id).maybeSingle();settings=st;$('salonName').textContent=s.salon_name;await hist();show('home')}$('loginBtn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)boot()};$('signupBtn').onclick=async()=>{const{error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'登録しました。'};$('forgotBtn').onclick=()=>{$('resetEmail').value=$('email').value||'';show('forgot')};$('backLogin').onclick=()=>show('login');$('sendReset').onclick=async()=>{const{error}=await sb.auth.resetPasswordForEmail($('resetEmail').value.trim(),{redirectTo:location.origin+'/?password-recovery=1'});$('forgotMsg').textContent=error?error.message:'再設定メールを送信しました。';$('forgotMsg').className=error?'error':'ok'};$('saveNewPass').onclick=async()=>{const a=$('newPass1').value,b=$('newPass2').value;if(a.length<6||a!==b){$('newPassMsg').textContent=a!==b?'確認用パスワードが一致しません。':'6文字以上で入力してください。';return}const{error}=await sb.auth.updateUser({password:a});$('newPassMsg').textContent=error?error.message:'変更しました。';if(!error)setTimeout(boot,500)};$('logout').onclick=async()=>{await sb.auth.signOut();show('login')};$('setupSave').onclick=async()=>{const{error}=await sb.rpc('create_salon_with_owner',{p_salon_name:$('sname').value,p_concept:$('concept').value,p_target_customer:$('customer').value});if(!error)boot()};$('newBtn').onclick=()=>{currentPromoId=null;show('form')};$('homeBtn').onclick=()=>show('home');$('backForm').onclick=()=>show('form');$('backPlans').onclick=()=>show('plansSec');function selectedOutputs(){let a=[];if($('outPop').checked)a.push('pop');if($('outLine').checked)a.push('line');if($('outInsta').checked)a.push('instagram');if($('outImage').checked)a.push('image');return a}async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('サーバー側でエラーが発生しました。')}if(!r.ok)throw Error(j.error||'AI生成エラー');return j}async function gen(){outputs=selectedOutputs();if(!outputs.length){$('formMsg').textContent='作成するものを1つ以上選んでください。';return}const j=await api('/api/plans',{salon:settings,start_date:$('start').value,end_date:$('end').value,theme:$('theme').value,gift_request:$('gift').value,target:$('target').value,sales_goal:$('sales').value,conditions:$('conditions').value,note:$('note').value});plans=j.plans;$('plans').innerHTML=plans.map(p=>`<div class="plan ${p.recommended?'reco':''}"><span class="tag">PLAN ${p.id}${p.recommended?'・おすすめ':''}</span><h3>${esc(p.title)}</h3><p><b>${esc(p.gift)}</b></p><p>${esc(p.reason)}</p><button class="btn" onclick="choose('${p.id}')">このプランにする</button></div>`).join('');show('plansSec')}$('propose').onclick=gen;$('regen').onclick=gen;window.choose=id=>{selected=plans.find(p=>p.id===id);$('summary').innerHTML=`<div>企画</div><div><b>${esc(selected.title)}</b></div><div>キャッチ</div><div>${esc(selected.catch)}</div><div>期間</div><div>${$('start').value} ～ ${$('end').value}</div><div>プレゼント</div><div>${esc(selected.gift)}</div>`;show('confirm')};$('make').onclick=async()=>{try{contents=await api('/api/contents',{salon:settings,plan:selected,start_date:$('start').value,end_date:$('end').value,target:$('target').value,sales_goal:$('sales').value,conditions:$('conditions').value,line_emoji:$('lineEmoji').value,instagram_emoji:$('instaEmoji').value,outputs});const{data:p,error}=await sb.from('promotions').insert({salon_id:salon.id,created_by:user.id,start_date:$('start').value,end_date:$('end').value,theme:$('theme').value,gift_request:$('gift').value,target:$('target').value,sales_goal:$('sales').value,conditions:$('conditions').value,requested_outputs:outputs,plan_candidates:plans,selected_plan:selected,status:'generated'}).select().single();if(error)throw error;currentPromoId=p.id;let rows=[];if(contents.pop)rows.push({promotion_id:p.id,content_type:'pop',title:contents.pop.headline,body:JSON.stringify(contents.pop),hashtags:[],version:1,is_current:true});if(contents.line)rows.push({promotion_id:p.id,content_type:'line',title:contents.line.title,body:contents.line.body,hashtags:[],version:1,is_current:true});if(contents.instagram)rows.push({promotion_id:p.id,content_type:'instagram',title:selected.title,body:contents.instagram.caption,hashtags:contents.instagram.hashtags||[],version:1,is_current:true});if(rows.length){const{error:e}=await sb.from('promotion_contents').insert(rows);if(e)throw e}imageSrc='';overlayTitle=selected.title;overlayGift=selected.gift;overlayFooter=`${fmtDate($('start').value)}〜${fmtDate($('end').value)} ／ ${$('conditions').value}`;popRatio=55;$('rtitle').textContent=selected.title;buildTabs();show('results')}catch(e){$('confirmMsg').textContent=e.message}};function buildTabs(){let t=[];if(outputs.includes('pop')){t.push(['pop','POP原稿'],['popdesign','店内POP完成版'])}if(outputs.includes('line'))t.push(['line','LINE']);if(outputs.includes('instagram'))t.push(['insta','Instagram']);if(outputs.includes('image'))t.push(['image','Instagram画像']);$('tabs').innerHTML=t.map((x,i)=>`<button class="tab ${i===0?'active':''}" data-t="${x[0]}">${x[1]}</button>`).join('');tab=t[0]?.[0]||'';document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));x.classList.add('active');tab=x.dataset.t;render()});render()}function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return`${x.getMonth()+1}月${x.getDate()}日`}function render(){if(tab==='pop'){$('result').innerHTML=`<h3>POP原稿を編集</h3><label>タイトル（改行可）</label><textarea id="popHead">${esc(contents.pop?.headline||selected.title)}</textarea><label>サブタイトル（改行可）</label><textarea id="popSub">${esc(contents.pop?.subheadline||selected.catch)}</textarea><label>本文</label><textarea id="popBody">${esc(contents.pop?.body||'')}</textarea><label>フッター</label><textarea id="popFooter">${esc(contents.pop?.footer||'')}</textarea><button class="btn" onclick="savePopEdit()">POP原稿を保存</button>`;return}if(tab==='line'){$('result').innerHTML=`<h3>LINE配信文を編集</h3><label>タイトル</label><textarea id="lineTitle">${esc(contents.line?.title||'')}</textarea><label>本文</label><textarea id="lineBody" style="min-height:260px">${esc(contents.line?.body||'')}</textarea><button class="btn" onclick="saveLineEdit()">LINEを保存</button>`;return}if(tab==='insta'){$('result').innerHTML=`<h3>Instagram投稿文を編集</h3><label>投稿文</label><textarea id="instaBody" style="min-height:330px">${esc(contents.instagram?.caption||'')}</textarea><label>ハッシュタグ</label><textarea id="instaTags">${esc((contents.instagram?.hashtags||[]).map(h=>'#'+h.replace(/^#/,'')).join(' '))}</textarea><button class="btn" onclick="saveInstaTextEdit()">Instagram投稿文を保存</button>`;return}if(tab==='popdesign'){const ratio=popRatio;const img=imageSrc?`<img src="${imageSrc}">`:'';$('result').innerHTML=`<div class="popPreview"><div class="popPhoto" style="height:${ratio}%">${img}<div class="popOverlayMain"><div class="popK">MONTHLY PRESENT</div><div class="popH">${esc(contents.pop?.headline||selected.title).replace(/\n/g,'<br>')}</div><div class="popSub">${esc(contents.pop?.subheadline||selected.catch).replace(/\n/g,'<br>')}</div><div class="popGift">${esc(contents.pop?.gift_display||selected.gift).replace(/\n/g,'<br>')}</div></div></div><div class="popBottom" style="height:${100-ratio}%"><div class="popFoot">${fmtDate($('start').value)}〜${fmtDate($('end').value)}<br>${esc($('target').value)} ／ ${esc($('conditions').value)}</div><div class="popBrand">${esc(salon.salon_name)}</div></div></div><div class="controlBox"><b>画像の大きさ</b><div class="seg"><button class="ratioBtn ${popRatio===50?'active':''}" onclick="setPopRatio(50)">50％</button><button class="ratioBtn ${popRatio===55?'active':''}" onclick="setPopRatio(55)">55％</button><button class="ratioBtn ${popRatio===60?'active':''}" onclick="setPopRatio(60)">60％</button></div><label>タイトル（改行可）</label><textarea id="popDesignHead">${esc(contents.pop?.headline||selected.title)}</textarea><label>サブタイトル（改行可）</label><textarea id="popDesignSub">${esc(contents.pop?.subheadline||selected.catch)}</textarea><label>プレゼント内容（改行可）</label><textarea id="popDesignGift">${esc(contents.pop?.gift_display||selected.gift)}</textarea><div class="actions"><button class="btn" onclick="savePopDesignText()">保存して反映</button><button class="btn btn2" onclick="downloadPop()">POP画像を保存</button></div></div>`;return}if(tab==='image'){$('result').innerHTML=`<div style="text-align:center">${imageSrc?`<div class="instaFrame"><img src="${imageSrc}"></div>`:'<p class="muted">まだ画像はありません。</p>'}<div class="quick"><button onclick="q('施術を受けている大人女性を主役にしてください。施術者の手元も自然に見せてください。')">施術シーン</button><button onclick="q('より上質で高級感のあるサロン空間にしてください。')">もっと高級感</button><button onclick="q('全体を明るく、清潔感のある自然光の印象にしてください。')">もっと明るく</button></div><label>画像の追加希望</label><textarea id="rev"></textarea><div class="actions"><button class="btn" onclick="makeImg()">${imageSrc?'画像を作り直す':'画像を生成する'}</button></div><p id="imsg"></p></div>`}}async function saveVersion(type,title,body,hashtags=[]){const{data:cur}=await sb.from('promotion_contents').select('id,version').eq('promotion_id',currentPromoId).eq('content_type',type).eq('is_current',true).order('version',{ascending:false}).limit(1).maybeSingle();if(cur)await sb.from('promotion_contents').update({is_current:false}).eq('id',cur.id);const{error}=await sb.from('promotion_contents').insert({promotion_id:currentPromoId,content_type:type,title,body,hashtags:hashtags||[],version:(cur?.version||0)+1,is_current:true});if(error)throw error;$('saveMsg').textContent='保存しました。';$('saveMsg').className='ok'}window.savePopEdit=async()=>{contents.pop={...contents.pop,headline:$('popHead').value,subheadline:$('popSub').value,body:$('popBody').value,footer:$('popFooter').value};await saveVersion('pop',contents.pop.headline,JSON.stringify(contents.pop),[]);render()};window.saveLineEdit=async()=>{contents.line={title:$('lineTitle').value,body:$('lineBody').value};await saveVersion('line',contents.line.title,contents.line.body,[]);render()};window.saveInstaTextEdit=async()=>{const tags=$('instaTags').value.split(/\s+/).filter(Boolean).map(x=>x.replace(/^#/,''));contents.instagram={caption:$('instaBody').value,hashtags:tags};await saveVersion('instagram',selected.title,contents.instagram.caption,tags);render()};window.setPopRatio=r=>{popRatio=r;render()};window.savePopDesignText=async()=>{contents.pop={...contents.pop,headline:$('popDesignHead').value,subheadline:$('popDesignSub').value,gift_display:$('popDesignGift').value,pop_ratio:popRatio};await saveVersion('pop',contents.pop.headline,JSON.stringify(contents.pop),[]);render()};window.q=t=>{$('rev').value=t;makeImg()};window.makeImg=async()=>{const m=$('imsg');m.textContent='画像を生成しています…';try{const j=await api('/api/image',{prompt:contents.image?.prompt_ja||`${selected.title} ${selected.gift}`,revision:$('rev').value});imageSrc=j.image_base64?`data:image/png;base64,${j.image_base64}`:j.image_url;if(imageSrc.startsWith('data:')&&currentPromoId){const blob=await(await fetch(imageSrc)).blob();const{data:old}=await sb.from('promotion_images').select('id,version').eq('promotion_id',currentPromoId).eq('image_type','instagram').eq('is_current',true).order('version',{ascending:false}).limit(1).maybeSingle();if(old)await sb.from('promotion_images').update({is_current:false}).eq('id',old.id);const v=(old?.version||0)+1,path=`${salon.id}/${currentPromoId}/instagram-v${v}.png`;const{error:up}=await sb.storage.from('promotion-images').upload(path,blob,{contentType:'image/png',upsert:false});if(up)throw up;const{error:ie}=await sb.from('promotion_images').insert({promotion_id:currentPromoId,image_type:'instagram',storage_path:path,generation_instruction:contents.image?.prompt_ja||'',version:v,is_current:true});if(ie)throw ie}render()}catch(e){m.textContent=e.message}};window.openPromo=async id=>{const{data:p}=await sb.from('promotions').select('*').eq('id',id).single();currentPromoId=id;selected=p.selected_plan||{title:p.theme,gift:p.gift_request,catch:''};outputs=p.requested_outputs||[];$('start').value=p.start_date;$('end').value=p.end_date;$('target').value=p.target||'';$('conditions').value=p.conditions||'';contents={};const{data:cs}=await sb.from('promotion_contents').select('*').eq('promotion_id',id).eq('is_current',true);for(const c of cs||[]){if(c.content_type==='pop'){try{contents.pop=JSON.parse(c.body)}catch{contents.pop={headline:c.title||'',subheadline:'',body:c.body,footer:''}}}if(c.content_type==='line')contents.line={title:c.title||'',body:c.body};if(c.content_type==='instagram')contents.instagram={caption:c.body,hashtags:c.hashtags||[]}}if((outputs.includes('image')||outputs.includes('pop'))&&!contents.image)contents.image={prompt_ja:`${selected.title} ${selected.gift} 女性向けエステサロンの上品な施術イメージ`};popRatio=Number(contents.pop?.pop_ratio)||55;imageSrc='';const{data:im}=await sb.from('promotion_images').select('*').eq('promotion_id',id).eq('image_type','instagram').eq('is_current',true).order('version',{ascending:false}).limit(1).maybeSingle();if(im){const{data:signed}=await sb.storage.from('promotion-images').createSignedUrl(im.storage_path,3600);if(signed?.signedUrl)imageSrc=signed.signedUrl}$('rtitle').textContent=selected.title+'（再編集）';buildTabs();show('results')};function drawCover(ctx,im,w,h){const s=Math.max(w/im.width,h/im.height),sw=im.width*s,sh=im.height*s;ctx.drawImage(im,(w-sw)/2,(h-sh)/2,sw,sh)}function drawLines(ctx,text,cx,y,size,maxWidth,lineH,font='sans-serif',weight='400'){ctx.font=`${weight} ${size}px ${font}`;let all=[];for(const para of String(text||'').split('\n')){let line='';for(const ch of[...para]){if(ctx.measureText(line+ch).width>maxWidth&&line){all.push(line);line=ch}else line+=ch}all.push(line)}all.forEach((l,i)=>ctx.fillText(l,cx,y+i*lineH));return y+all.length*lineH}window.downloadPop=async()=>{const w=1240,h=1754,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#faf7f2';ctx.fillRect(0,0,w,h);const ph=Math.round(h*(popRatio/100));if(imageSrc){const im=new Image();im.crossOrigin='anonymous';im.src=imageSrc;await new Promise((ok,no)=>{im.onload=ok;im.onerror=no});drawCover(ctx,im,w,ph);ctx.fillStyle='rgba(255,255,255,.43)';ctx.fillRect(0,0,w,ph)}ctx.textAlign='center';ctx.fillStyle='#3d372f';ctx.font='25px sans-serif';ctx.fillText('MONTHLY PRESENT',w/2,ph*.22);let y=drawLines(ctx,contents.pop?.headline||selected.title,w/2,ph*.31,56,950,68,'serif','600');y=drawLines(ctx,contents.pop?.subheadline||selected.catch,w/2,y+24,31,900,42);ctx.strokeStyle='#917d64';ctx.beginPath();ctx.moveTo(280,y+30);ctx.lineTo(960,y+30);ctx.stroke();y=drawLines(ctx,contents.pop?.gift_display||selected.gift,w/2,y+80,43,820,53,'serif','600');ctx.beginPath();ctx.moveTo(280,y+12);ctx.lineTo(960,y+12);ctx.stroke();ctx.font='26px sans-serif';ctx.fillText(`${fmtDate($('start').value)}〜${fmtDate($('end').value)}`,w/2,ph+120);ctx.fillText(`${$('target').value} ／ ${$('conditions').value}`,w/2,ph+165);ctx.font='23px sans-serif';ctx.fillText(salon.salon_name,w/2,h-55);const a=document.createElement('a');a.download=`${selected.title||'salon-pop'}.png`;a.href=c.toDataURL('image/png');a.click()};$('done').onclick=async()=>{await hist();show('home')};async function hist(){const{data}=await sb.from('promotions').select('*').eq('salon_id',salon.id).order('created_at',{ascending:false}).limit(10);$('history').innerHTML=!data?.length?'まだありません。':data.map(x=>`<div class="item" onclick="openPromo('${x.id}')"><b>${esc(x.selected_plan?.title||x.theme)}</b><div class="muted">${x.start_date} ～ ${x.end_date} ／ クリックして確認・修正</div></div>`).join('')}sb.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY')show('newPassword')});if(location.search.includes('password-recovery=1'))show('newPassword');else boot();</script></body></html>
