</style></head><body><main class="wrap"><div class="head"><div><h2 style="margin:0">月間サロン販促メーカー</h2><div id="salonName" class="muted">テスト版</div></div><button id="logout" class="btn btn2 hide">ログアウト</button></div><section id="login" class="card"><h2>ログイン</h2><label>メールアドレス</label><input id="email" type="email"><label>パスワード</label><input id="password" type="password"><p id="loginMsg"></p><div class="actions"><button id="loginBtn" class="btn">ログイン</button><button id="signupBtn" class="btn btn2">新規登録</button></div><button id="forgotBtn" class="linkbtn">パスワードを忘れた方</button></section><section id="forgot" class="card hide"><h2>パスワード再設定</h2><label>メールアドレス</label><input id="resetEmail" type="email"><p id="forgotMsg"></p><div class="actions"><button id="sendReset" class="btn">再設定メールを送る</button><button id="backLogin" class="btn btn2">ログインへ戻る</button></div></section><section id="newPassword" class="card hide"><h2>新しいパスワードを設定</h2><label>新しいパスワード</label><input id="newPass1" type="password"><label>新しいパスワード（確認）</label><input id="newPass2" type="password"><p id="newPassMsg"></p><button id="saveNewPass" class="btn">パスワードを変更</button></section><section id="setup" class="card hide"><h2 id="setupTitle">サロン初期設定</h2><label>サロン名</label><input id="sname"><label>コンセプト</label><textarea id="concept"></textarea><label>主なお客様</label><input id="customer" value="30〜50代女性"><p id="setupMsg"></p><div class="actions"><button id="setupSave" class="btn">保存</button><button id="setupCancel" class="btn btn2 hide">キャンセル</button></div></section><section id="home" class="hide"><div class="card hero"><h2>今月の販促を、まとめて作成</h2><div class="actions" style="justify-content:center"><button id="newBtn" class="btn">＋ 新しい販促をつくる</button><button id="editSalonBtn" class="btn btn2">サロン情報を編集</button></div></div><div class="card"><h3>最近作った販促</h3><p class="muted">過去の販促は再編集できます。不要になったものは削除できます。</p><div id="history"></div></div></section><section id="form" class="card hide"><h2>今月は、どんな企画にしますか？</h2><div class="row"><div><label>開始日</label><input id="start" type="date" value="2026-09-01"></div><div><label>終了日</label><input id="end" type="date" value="2026-09-30"></div></div><label>希望テーマ</label><input id="theme" value="夏の頭の疲れ"><label>プレゼント内容</label><input id="gift" value="提案希望"><label>対象者</label><input id="target" value="ご来店のお客様全員"><label>条件</label><input id="conditions" value="お一人様1回限り"><label>今回作成するもの</label><div class="checks"><label class="check"><input id="outPop" type="checkbox" checked>店内POP</label><label class="check"><input id="outLine" type="checkbox" checked>LINE配信文</label><label class="check"><input id="outInsta" type="checkbox" checked>Instagram投稿文</label><label class="check"><input id="outImage" type="checkbox" checked>Instagram画像</label></div><div class="row"><div><label>LINEの絵文字</label><select id="lineEmoji"><option value="none">なし</option><option value="low" selected>控えめ</option><option value="standard">標準</option><option value="high">多め</option></select></div><div><label>Instagramの絵文字</label><select id="instaEmoji"><option value="none">なし</option><option value="low" selected>控えめ</option><option value="standard">標準</option><option value="high">多め</option></select></div></div><p id="formMsg"></p><div class="actions"><button id="propose" class="btn">AIに販促プランを提案してもらう</button><button id="homeBtn" class="btn btn2">HOME</button></div></section><section id="plansSec" class="hide"><h2>AIから3つの販促プラン</h2><div id="plans" class="plans"></div><div class="card"><label>こんな感じにしたい</label><textarea id="note"></textarea><div class="actions"><button id="regen" class="btn">希望を反映して再提案</button><button id="backForm" class="btn btn2">入力に戻る</button></div></div></section><section id="confirm" class="card hide"><h2>この内容で作成します</h2><div id="summary" class="summary"></div><p id="confirmMsg"></p><div class="actions"><button id="make" class="btn">選んだ販促物を作成</button><button id="backPlans" class="btn btn2">企画に戻る</button></div></section><section id="results" class="hide"><h2 id="rtitle">販促セット</h2><div id="tabs" class="     variants[i]==='interior' ? 'サロン空間' :
    'イメージビジュアル'
  );

    }catch(e){
      try{
        const safeRevision=`

オイル、美容用品、自然光などを使って、
今回の美容ケアを上品に連想できる広告イメージにする。
性的・官能的な表現は一切含めない。
`;

        const retrySrc=await generateOneImage(
          safeRevision,
          i===1?'interior':'concept'
        );

        if(retrySrc){
  made.push(retrySrc);
  imageCandidateLabels.push(
    i===0 ? '施術イメージ（人物・施術の代替案）' :
i===1 ? 'サロン空間（人物・施術の代替案）' :
'イメージビジュアル（人物・施術の代替案）'
  );
}

      }catch(retryError){
        console.warn(
          `画像候補${i+1}は生成できませんでした`,
          retryError
        );
      }
    }
  }

  imageCandidates=made;

  if(made.length===3){
    imageStatus='方向性の違う3候補から使いたい画像を選んでください。';
  }else if(made.length){
    imageStatus=`${made.length}候補を生成しました。必要に応じてもう一度生成できます。`;

};
